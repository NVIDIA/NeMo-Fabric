[workspace]
members = [
    "crates/fabric-core",
    "crates/fabric-cli",
    "crates/fabric-python",
    "environment-providers/openshell",
]
default-members = [
    "crates/fabric-core",
    "crates/fabric-cli",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/nemo-fabric"

[workspace.dependencies]
nemo-fabric-core = { path = "crates/fabric-core", version = "0.6.0" }

clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
# Validate adapter-owned JSON Schema in Rust while preserving precise instance paths.
# `schemars` only generates schemas, and delegating validation to Python would cross
# the language-neutral core boundary. The smaller validator evaluated for this path
# misreported array indices after `prefixItems`, making `jsonschema` the narrowest
# option with correct diagnostics. Keep remote and local `$ref` retrieval disabled for
# untrusted adapter schemas.
jsonschema = { version = "0.49", default-features = false }
# Process-tree cleanup when a stuck local adapter host must be killed.
libc = "0.2.186"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for the `what_ran` string length rule, which ends a cut value with a
# digest prefix. Std has no SHA-256, and `sha2` 0.10 is already in the lockfile
# through the OpenShell provider.
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
pyo3 = "0.28.2"

[workspace.lints.rust]
missing_docs = "warn"
