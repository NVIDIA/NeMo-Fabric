# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/reference/configuration
language: "en-US"
tone_instructions: "Be concise, technical, and specific. Prioritize correctness, safety, and maintainability over style nits."

reviews:
  profile: assertive
  review_status: true
  review_details: true
  collapse_walkthrough: false
  request_changes_workflow: false
  pre_merge_checks:
    title:
      mode: error
      requirements: >-
        Title must follow Conventional Commits format:
        type(optional-scope)[!]: concise imperative summary

        Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
        Use lowercase type and scope. If the change is a breaking change, add a ! suffix before the colon.
        Keep it under 72 characters and do not use a trailing period.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Fork source branch
        mode: warning
        instructions: |
          Determine whether this pull request's source (head) repository differs
          from its target (base) repository using GitHub pull request metadata.
          Pass when the source repository is a fork of the target repository.
          When both repositories are the same, warn in the PR review comment:
          "Please open pull requests from a branch in your own fork of this
          repository. Recreate this PR from your fork with the same changes;
          do not create topic branches in the upstream repository."
          Apply this policy regardless of author, source branch name, or target
          branch, including main and release branches.
          If repository metadata is unavailable or the fork relationship cannot
          be established, report the check as inconclusive rather than guessing
          from branch names, commit authors, or the PR description.
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: |
    Generate the PR title using Conventional Commits format:
    type(optional-scope)[!]: concise imperative summary

    Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
    Prefer scopes from this repository when clear: core, cli, python, schemas, adapters, docs, ci, deps
    Use lowercase type and scope. If the change is a breaking change, add a ! suffix before the colon.
    Keep it under 72 characters and do not use a trailing period.
  auto_review:
    base_branches: ["main", "release/.*"]
    enabled: true
    drafts: true
    auto_incremental_review: true
  path_filters:
    - "!target/**"
    - "!**/target/**"
    - "!.venv/**"
    - "!**/.venv/**"
    - "!**/node_modules/**"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!.tmp/**"
    - "!docs/python-sdk/**"
  path_instructions:
    - path: "crates/fabric-core/src/**/*.rs"
      instructions: |
        Review the Rust core for runtime lifecycle correctness, handle validation, capability routing accuracy, schema stability, and error semantics.
        Public API changes should match committed schemas, tests, and documentation.
    - path: "crates/fabric-python/**/*"
      instructions: |
        Treat native binding changes as public API changes. Check JSON/type conversion, error propagation, GIL/thread behavior, and parity with the Python SDK.
    - path: "sdk/python/nemo-fabric-runtime/src/nemo_fabric/**/*"
      instructions: |
        Review Python SDK changes for typed API consistency, import-time dependency neutrality, async/session behavior, and parity with the native extension.
        Stubs and runtime implementations should stay aligned.
    - path: "schemas/**/*"
      instructions: |
        Schemas are generated public contract snapshots. Check that schema diffs correspond to intentional Rust type changes and are covered by core tests.
    - path: "tests/**"
      instructions: |
        Tests should cover the behavior promised by the changed API surface, including error paths, lifecycle cleanup, and SDK/native parity where relevant.
    - path: "{adapters/**,examples/**}"
      instructions: |
        Review adapter and example changes for command correctness, config/schema consistency, artifact handling, and compatibility with the public NeMo Fabric contracts.
    - path: "{docs/**,README.md,AGENTS.md}"
      instructions: |
        Review documentation for technical accuracy against the current API, command correctness, and consistency with generated schemas.
        For links between files under docs/, require paths relative to the source file with the target file's .mdx extension so they work in both Fern builds and repository browsers. Flag Fern site-root links such as [NeMo Fabric overview](/nemo/fabric/about-nemo-fabric/overview); use the repository-relative equivalent, such as [NeMo Fabric overview](../about-nemo-fabric/overview.mdx).
    - path: "{*.md,**/*.md,**/*.mdx,**/*.ipynb}"
      instructions: |
        Enforce the product name in user-facing prose: use "NVIDIA NeMo Fabric" on first use and "NeMo Fabric" thereafter. Flag standalone capitalized "Fabric" when it refers to the product. Do not flag the lowercase `fabric` CLI command, package/import/crate names, code identifiers, API symbols, configuration keys, file paths, or unrelated generic uses of the word.
    - path: "**/SKILL.md"
      instructions: |
        Do not flag SKILL.md files for missing SPDX headers. Skill entrypoints intentionally start with YAML frontmatter instead.
        Verify that every SKILL.md keeps valid YAML frontmatter with at least name and description fields before the Markdown body.
  poem: false
  sequence_diagrams: true
  suggested_reviewers: false

  tools:
    clippy:
      enabled: true
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - ".agents/skills/**/*.md"
