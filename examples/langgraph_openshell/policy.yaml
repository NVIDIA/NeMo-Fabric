version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /opt/nemo-fabric
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  courier_fallback:
    name: Courier fallback route
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /
    binaries:
      - path: /usr/local/bin/python*
