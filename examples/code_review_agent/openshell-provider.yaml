# NVIDIA's OpenAI-compatible endpoint; the agent receives a shadow credential.
id: nvidia-code-review
display_name: NVIDIA Code Review
description: NVIDIA-hosted model access for the Hermes code-review example
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/python3.13
  - /usr/local/bin/python3.14
  - /opt/fabric/bin/python
