# NVIDIA API Catalog access through an OpenAI-compatible LangChain model.
id: nvidia-langgraph
display_name: NVIDIA API Catalog for LangGraph
description: NVIDIA API Catalog access for the LangGraph custom-agent example
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /opt/fabric/bin/python
  - /usr/local/bin/python3.14
