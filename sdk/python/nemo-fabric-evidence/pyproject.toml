[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-fabric-evidence"
version = "0.6.0"
description = "Shared software evidence for NVIDIA NeMo Fabric SDKs and adapters"
authors = [{ name = "NVIDIA Corporation" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
