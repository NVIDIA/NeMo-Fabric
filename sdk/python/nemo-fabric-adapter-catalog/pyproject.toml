[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-fabric-adapter-catalog"
version = "0.5.0"
description = "Metadata-only catalog of bundled NVIDIA NeMo Fabric adapter descriptors"
authors = [{ name = "NVIDIA Corporation" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/NVIDIA/NeMo-Fabric"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nemo_fabric_adapter_catalog = ["catalog.json", "py.typed"]
