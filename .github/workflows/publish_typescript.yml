name: Publish TypeScript package

on:
  workflow_call:
    inputs:
      ref:
        description: 'The Git tag ref to publish'
        required: true
        type: string
  push:
    tags:
      - 'v*'
      - '!v*-alpha*'

concurrency:
  group: publish-typescript
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish-typescript:
    name: Publish (npmjs.com)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # actions/checkout needs read access to the tagged repository contents.
      contents: read
      # npm trusted publishing exchanges this job's GitHub OIDC token for a
      # short-lived registry credential; no long-lived npm token is provided.
      id-token: write
    environment: npmjs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify release tag
        id: source
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "Release ref must be a tag: ${RELEASE_REF}" >&2
            exit 1
          fi
          release_tag="${RELEASE_REF#refs/tags/}"
          tag_commit="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag ${release_tag} points to ${tag_commit}, not checked-out commit ${head_commit}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install just
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@1.50.0

      - name: Validate trusted publishing toolchain
        run: |
          set -euo pipefail

          node --version
          npm_version="$(npm --version)"
          echo "$npm_version"
          NPM_VERSION="$npm_version" node <<'NODE'
          const actual = process.env.NPM_VERSION.split('.').map(Number);
          const minimum = [11, 5, 1];
          const comparison = actual.findIndex(
            (part, index) => part !== minimum[index],
          );

          if (
            actual.length !== minimum.length ||
            actual.some(Number.isNaN) ||
            (comparison !== -1 && actual[comparison] < minimum[comparison])
          ) {
            throw new Error('npm 11.5.1 or newer is required for trusted publishing');
          }
          NODE

      - name: Prepare release metadata
        id: release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail

          version="$(python3 scripts/ci/normalize_release_tag.py "$RELEASE_TAG")"
          if [[ "$version" == *+* ]]; then
            echo "npm publication does not support build metadata: $version" >&2
            exit 1
          fi

          case "$version" in
            *-alpha*) dist_tag="alpha" ;;
            *-beta*|*-rc*) dist_tag="next" ;;
            *-*)
              echo "Unsupported npm prerelease: $version" >&2
              exit 1
              ;;
            *) dist_tag="latest" ;;
          esac

          python3 scripts/ci/set_typescript_project_version.py "$version"
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Test package
        run: just test-typescript

      - name: Publish package
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_typescript_package.py \
            --package-directory adapter-contract/typescript \
            --version "$RELEASE_VERSION" \
            --dist-tag "$RELEASE_DIST_TAG"
