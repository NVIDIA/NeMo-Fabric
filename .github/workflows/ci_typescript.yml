name: TypeScript

on:
  workflow_call:
    inputs:
      ref:
        description: 'The Git ref to validate'
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-typescript-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.18.3', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: adapter-contract/typescript/package-lock.json

      - name: Install just
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@1.50.0

      - name: Test TypeScript contract package
        run: just test-typescript-contract

  test-adapters:
    name: Test adapters (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: adapters/typescript/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install just
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@1.50.0

      - name: Test TypeScript adapter packages
        run: just test-typescript-adapters

      - name: Set up uv for Relay smoke
        if: matrix.node-version == '22.19.0'
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8

      - name: Install released Relay CLI
        if: matrix.node-version == '22.19.0'
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/nemo-relay-bin
          UV_TOOL_DIR: ${{ runner.temp }}/nemo-relay-tools
        run: uv tool install --no-cache nemo-relay-cli-bin==0.9.0

      - name: Test released Relay Pi smoke
        if: matrix.node-version == '22.19.0'
        env:
          FABRIC_TEST_NEMO_RELAY_COMMAND: ${{ runner.temp }}/nemo-relay-bin/nemo-relay
        run: >-
          node --test
          --test-name-pattern='runs the released Relay CLI and shipped Pi extension end to end'
          adapters/typescript/pi/test/relay-smoke.test.mjs
