[build-system]
requires = [
  "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-fabric-adapters-remote-agent"
version = "0.3.0"
description = "Remote agent adapter for NeMo Fabric"
authors = [
  { name = "NVIDIA Corporation" },
]
keywords = ["agents", "ai", "nemo-fabric", "runtime", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "pypi.md"
requires-python = ">=3.11"
dependencies = [
  "nemo-fabric-adapter-contract == 0.3.0",
  "nemo-fabric-adapters-common == 0.3.0",
  "httpx~=0.28",
]

[project.optional-dependencies]
full = []

[project.urls]
Repository = "https://github.com/NVIDIA/NeMo-Fabric"
Homepage = "https://github.com/NVIDIA/NeMo-Fabric"
Issues = "https://github.com/NVIDIA/NeMo-Fabric/issues"
Documentation = "https://docs.nvidia.com/nemo/fabric"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nemo_fabric_adapters.remote_agent*"]

[tool.setuptools.data-files]
"share/nemo-fabric/adapters/remote-agent" = ["remote-agent.fabric-adapter.json"]

[tool.uv.sources]
nemo-fabric-adapter-contract = { path = "../../adapter-contract/python", editable = true }
nemo-fabric-adapters-common = { path = "../common", editable = true }
