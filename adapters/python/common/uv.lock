version = 1
revision = 3
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version >= '3.14' and sys_platform == 'win32'",
    "python_full_version >= '3.14' and sys_platform != 'win32'",
    "python_full_version < '3.14' and sys_platform == 'win32'",
    "python_full_version < '3.14' and sys_platform != 'win32'",
]

[[package]]
name = "nemo-fabric-adapter-contract"
version = "0.3.0"
source = { editable = "../../../adapter-contract/python" }

[package.metadata]
requires-dist = [{ name = "pydantic", marker = "extra == 'pydantic'", specifier = ">=2.12,<3" }]
provides-extras = ["pydantic"]

[[package]]
name = "nemo-fabric-adapters-common"
version = "0.3.0"
source = { editable = "." }
dependencies = [
    { name = "nemo-fabric-adapter-contract" },
]

[package.metadata]
requires-dist = [{ name = "nemo-fabric-adapter-contract", editable = "../../../adapter-contract/python" }]
